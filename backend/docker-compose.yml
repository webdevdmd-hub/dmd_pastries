version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pastries-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pastries_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pastries_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pastries-pos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pastries_pos?sslmode=disable
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pastries_pos
      POSTGRES_SSLMODE: disable
      POSTGRES_TIMEZONE: UTC
    ports:
      - "8080:8080"

volumes:
  postgres_data:
